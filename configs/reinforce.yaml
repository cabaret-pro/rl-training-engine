experiment:
  name: reinforce-baseline
  seed: 42
model:
  name: tiny-categorical-policy
  dtype: float32
algorithm:
  name: reinforce
  baseline: batch_mean
  loss_normalization: sequence_mean
training:
  learning_rate: 0.01
  batch_size: 32
  max_steps: 100
rollout:
  backend: transformers
  temperature: 1.0
  max_completion_tokens: 16
reward:
  name: arithmetic
evaluation:
  interval_steps: 10
  num_examples: 100
checkpoint:
  interval_steps: 25
  keep_last: 3
logging:
  backend: console
  interval_steps: 1

