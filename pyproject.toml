[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rl-training-engine"
version = "0.1.0"
description = "A correctness-first reinforcement learning engine for language models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Justin Rebollo" }]
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "torch>=2.5,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
]
lm = [
  "transformers>=4.48,<5",
]

[project.scripts]
rl-engine = "rl_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rl_engine"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

